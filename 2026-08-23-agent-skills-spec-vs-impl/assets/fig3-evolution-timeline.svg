<text dominant-baseline="central" text-anchor="start" style="font-size:13.5px;font-family:Noto Sans CJK SC, Noto Sans SC, sans-serif;" xml:space="preserve" y="65" transform="translate(1378 1155)" fill="#333">⑧ 26-04-15　Trae / Qoder / ZCode / Kimi Code 等国内工具文档化支持</text>
