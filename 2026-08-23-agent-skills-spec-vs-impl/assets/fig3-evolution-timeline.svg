<text dominant-baseline="central" text-anchor="start" style="font-size:13.5px;font-family:Noto Sans CJK SC, Noto Sans SC, sans-serif;" xml:space="preserve" y="39" transform="translate(70 1155)" fill="#333">② 25-12-09　MCP 捐赠 Linux 基金会，AAIF 成立</text>
<text dominant-baseline="central" text-anchor="start" style="font-size:13.5px;font-family:Noto Sans CJK SC, Noto Sans SC, sans-serif;" xml:space="preserve" y="65" transform="translate(70 1155)" fill="#333">③ 25-12-18　Agent Skills 作为开放标准发布（agentskills.io）</text>
<text dominant-baseline="central" text-anchor="start" style="font-size:13.5px;font-family:Noto Sans CJK SC, Noto Sans SC, sans-serif;" xml:space="preserve" y="91" transform="translate(70 1155)" fill="#333">④ 25-12-18　GitHub Copilot 同日宣布支持 Agent Skills</text>
<text dominant-baseline="central" text-anchor="start" style="font-size:13.5px;font-family:Noto Sans CJK SC, Noto Sans SC, sans-serif;" xml:space="preserve" y="117" transform="translate(70 1155)" fill="#333">⑤ 25-12-20　OpenAI 为 Codex 文档加入 Skills 支持</text>
